<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь съёмок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: summary tiles on top, then one row per week with three day cards (Пн YouTube, Ср Хаб, Пт Магазины). */
:root {
  --bg: #f5f5fa;
  --surface: #ffffff;
  --ink: #14142b;
  --muted: #6a6a86;
  --line: #e4e4ef;
  --accent: #423ffe;
  --on-accent: #ffffff;
  --yt: #e5533d;
  --hub: #423ffe;
  --shop: #0d9488;
  --good: #168a45;
  --warn: #b86e00;
  --bad: #d12f2f;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f1a; --surface: #181828; --ink: #f0f0fa; --muted: #9a9ab8; --line: #2a2a40;
    --accent: #8583ff; --on-accent: #0f0f1a; --yt: #ff7a63; --hub: #8583ff; --shop: #2dd4bf; --good: #4ade80; --warn: #fbbf24; --bad: #ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f1a; --surface: #181828; --ink: #f0f0fa; --muted: #9a9ab8; --line: #2a2a40;
  --accent: #8583ff; --on-accent: #0f0f1a; --yt: #ff7a63; --hub: #8583ff; --shop: #2dd4bf; --good: #4ade80; --warn: #fbbf24; --bad: #ff6b6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 6px 0 4px; font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 24px; }
.tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.sync { font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.sync.on { color: var(--good); }
.theme { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.theme:hover { border-color: var(--accent); }
.theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rhythm { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.yt { --c: var(--yt); } .hub { --c: var(--hub); } .shop { --c: var(--shop); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.tile .k { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; font-weight: 600; color: var(--muted); }
.tile .n { color: var(--muted); font-size: 13px; margin-top: 4px; }
.bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 12px; overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

.next { background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 18px 20px; margin-bottom: 28px; }
.next .k { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.next .t { font-size: 18px; font-weight: 700; }

.week { margin-bottom: 26px; }
.wh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
.wh h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.wh span { color: var(--muted); font-size: 13px; font-weight: 600; }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.card.today { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.off { opacity: .6; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.date { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.date small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-top: 4px; }
.plan { text-align: right; font-size: 12px; color: var(--muted); font-weight: 600; }
.plan b { display: block; font-size: 26px; font-weight: 800; color: var(--c); line-height: 1; }
.task { font-size: 14px; }
.who { font-size: 12px; color: var(--muted); }
.chip { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: var(--cc, var(--muted)); background: color-mix(in srgb, var(--cc, var(--muted)) 14%, transparent); }
.chip.g { --cc: var(--good); } .chip.w { --cc: var(--warn); } .chip.r { --cc: var(--bad); } .chip.a { --cc: var(--accent); }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
.ctl label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
.step button:hover { border-color: var(--accent); }
.step output { min-width: 28px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.bonus { background: color-mix(in srgb, var(--yt) 9%, transparent); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
.cbtn { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.cbtn:hover { color: var(--accent); }
.cbtn b { color: var(--accent); }
.cm { display: flex; flex-direction: column; gap: 8px; }
.cm .it { background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; position: relative; padding-right: 28px; overflow-wrap: anywhere; }
.cm .it small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.cm .it button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; border-radius: 6px; }
.cm .it button:hover { color: var(--bad); }
.cm form { display: flex; gap: 6px; }
.cm input[type=text] { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; }
.cm form button { padding: 0 12px; border-radius: 9px; border: 0; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.foot { color: var(--muted); font-size: 12px; margin-top: 32px; }
@media (max-width: 760px) {
  .tiles, .row { grid-template-columns: 1fr; }
  .sync { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Айсити · студия</div>
      <h1>Предновогодний сезон</h1>
    </div>
    <div class="tools">
      <span class="sync" id="sync">Только в этом браузере</span>
      <button class="theme" id="theme" type="button" aria-label="Сменить тему"></button>
    </div>
  </div>
  <p class="sub">16 ноября – 30 декабря · 20 съёмочных дней · одна задача на день</p>
  <div class="rhythm">
    <span class="pill yt"><i></i>Понедельник · YouTube</span>
    <span class="pill hub"><i></i>Среда · Хаб</span>
    <span class="pill shop"><i></i>Пятница · Магазины</span>
  </div>
  <div class="tiles" id="tiles"></div>
  <div id="next"></div>
  <div id="weeks"></div>
  <p class="foot" id="backup" hidden>Данные хранятся в этом браузере. <button class="cbtn" type="button" id="exp">Сохранить копию</button> · <button class="cbtn" type="button" id="imp">Загрузить копию</button><input type="file" id="impf" accept="application/json" hidden></p>
</div>
<script>
var BR = { yt: "YouTube", hub: "Хаб", shop: "Магазины" };
var MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var WD = { 1: "Понедельник", 3: "Среда", 5: "Пятница" };
var BONUS = "Если успели: ролики YouTube в запас";
var DAYS = [
  { d: "2026-11-16", b: "yt",   n: 2,  t: "2 ролика, основная съёмка", who: "Аня" },
  { d: "2026-11-18", b: "hub",  n: 14, t: "14 рилсов, хватит на неделю вперёд", who: "Аня" },
  { d: "2026-11-20", b: "shop", n: 7,  t: "Пилот: 5 FAQ (рассрочка, трейд-ин, проверка iPhone, обмен подарка, доставка) и 2 распаковки", who: "Аня и Костя" },
  { d: "2026-11-23", b: "yt",   n: 2,  t: "2 ролика", who: "Аня" },
  { d: "2026-11-25", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" },
  { d: "2026-11-27", b: "shop", n: 7,  t: "5 FAQ (память, подарок до 15 000, подарок до 40 000, перенос данных, оригинал и гарантия) и 2 распаковки. Чёрная пятница, если участвуем", who: "Аня и Костя" },
  { d: "2026-11-30", b: "yt",   n: 2,  t: "2 ролика, подарочная тема", who: "Аня" },
  { d: "2026-12-02", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" },
  { d: "2026-12-04", b: "shop", n: 7,  t: "FAQ про чехол, стекло и зарядку не в комплекте, 3 вопроса из чатов магазинов и 2 распаковки хитов подарков", who: "Аня и Костя", bonus: true },
  { d: "2026-12-07", b: "yt",   n: 2,  t: "2 ролика", who: "Аня" },
  { d: "2026-12-09", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" },
  { d: "2026-12-11", b: "shop", n: 7,  t: "5 вопросов из чатов магазинов и 2 распаковки", who: "Аня и Костя", bonus: true },
  { d: "2026-12-14", b: "yt",   n: 2,  t: "2 ролика", who: "Аня" },
  { d: "2026-12-16", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" },
  { d: "2026-12-18", b: "shop", n: 7,  t: "5 FAQ про сроки к Новому году (доставка, наличие, обмен подарка) и 2 распаковки", who: "Аня и Костя", bonus: true },
  { d: "2026-12-21", b: "yt",   n: 2,  t: "2 ролика", who: "Аня" },
  { d: "2026-12-23", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" },
  { d: "2026-12-25", b: "shop", n: 7,  t: "5 FAQ и 2 распаковки", who: "Аня и Костя", bonus: true },
  { d: "2026-12-28", b: "shop", n: 7,  t: "Запас магазинов на 1–7 января: 5 FAQ и 2 распаковки", who: "Аня и Костя" },
  { d: "2026-12-30", b: "hub",  n: 14, t: "14 рилсов", who: "Аня" }
];
var WEEKS = [
  { from: "2026-11-16", title: "16–22 ноября", phase: "Запуск" },
  { from: "2026-11-23", title: "23–29 ноября", phase: "База" },
  { from: "2026-11-30", title: "30 ноября – 6 декабря", phase: "Подарки" },
  { from: "2026-12-07", title: "7–13 декабря", phase: "Подарки" },
  { from: "2026-12-14", title: "14–20 декабря", phase: "Успей к Новому году" },
  { from: "2026-12-21", title: "21–27 декабря", phase: "Успей к Новому году" },
  { from: "2026-12-28", title: "28 декабря – 3 января", phase: "Запас на январь" }
];

/* ---------- состояние: общее хранилище, если есть, иначе этот браузер ---------- */
var KEY = "icity-ny-2026";
var S = { ready: {}, done: {}, bonus: {} };
var C = [];          // комментарии: { id, d, text, at, by }
var OPEN = {};       // открытые панели комментариев
var DRAFT = {};      // недописанные комментарии
var DB = null, WHO = "";

function loadLocal() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var o = JSON.parse(raw); S = o.S || S; C = o.C || C; }
  } catch (e) {}
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify({ S: S, C: C })); } catch (e) {} }
function safe(p) { try { if (p && p.catch) p.catch(function () {}); } catch (e) {} }

function docsOf(snap) {
  var arr = [];
  if (snap && snap.docs) arr = snap.docs.slice ? snap.docs.slice() : snap.docs;
  else if (snap && snap.forEach) snap.forEach(function (d) { arr.push(d); });
  return arr.map(function (d) { return { id: d.id, data: (typeof d.data === "function" ? d.data() : d.data) || {} }; });
}
function saveDay(d) {
  saveLocal();
  if (DB) safe(DB.doc("days/" + d).set({ ready: !!S.ready[d], done: S.done[d] || 0, bonus: S.bonus[d] || 0 }));
}
function addComment(d, text) {
  var c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: d, text: text, at: Date.now(), by: WHO };
  C.push(c); saveLocal();
  if (DB) safe(DB.doc("comments/" + c.id).set({ d: c.d, text: c.text, at: c.at, by: c.by }));
}
function delComment(id) {
  C = C.filter(function (c) { return c.id !== id; }); saveLocal();
  if (DB) safe(DB.doc("comments/" + id).delete());
}
async function connect() {
  try {
    if (!window.claude || !window.claude.use) return;
    var db = await window.claude.use("db");
    if (!db) return;
    try {
      var u = await window.claude.use("user");
      if (u && u.name) WHO = typeof u.name === "function" ? await u.name() : u.name;
    } catch (e) {}
    db.collection("days").onSnapshot(function (snap) {
      var s = { ready: {}, done: {}, bonus: {} };
      docsOf(snap).forEach(function (x) {
        if (x.data.ready) s.ready[x.id] = true;
        if (x.data.done) s.done[x.id] = x.data.done;
        if (x.data.bonus) s.bonus[x.id] = x.data.bonus;
      });
      S = s; DB = db; setSync(true); render();
    }, function () {});
    db.collection("comments").onSnapshot(function (snap) {
      C = docsOf(snap).map(function (x) { return { id: x.id, d: x.data.d, text: x.data.text, at: x.data.at || 0, by: x.data.by || "" }; })
        .sort(function (a, b) { return a.at - b.at; });
      DB = db; setSync(true); render();
    }, function () {});
  } catch (e) {}
}
function setSync(on) {
  var el = document.getElementById("sync");
  el.textContent = on ? "Общие данные" : "Только в этом браузере";
  el.className = "sync" + (on ? " on" : "");
}

/* ---------- тема ---------- */
var THEME_KEY = "icity-ny-theme";
var ICONS = {
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
};
function currentTheme() {
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme").innerHTML = t === "dark" ? ICONS.sun : ICONS.moon;
}
function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(saved === "dark" || saved === "light" ? saved : currentTheme());
}
document.getElementById("theme").addEventListener("click", function () {
  var t = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
});

/* ---------- отрисовка ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function startOfToday() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function diffDays(a, b) { return Math.round((a - b) / 86400000); }
function fmt(s) { var d = parse(s); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function fmtTs(ts) { var d = new Date(ts); return d.getDate() + " " + MONTHS[d.getMonth()] + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }

function status(day, today) {
  var dt = parse(day.d), diff = diffDays(dt, today), done = S.done[day.d] || 0;
  if (diff > 0) {
    if (S.ready[day.d]) return ["Готово к съёмке", "g"];
    if (diff <= 2) return ["Нужны сценарии", "w"];
    return ["Впереди", ""];
  }
  if (done > day.n) return ["Снято +" + (done - day.n) + " сверх плана", "g"];
  if (done >= day.n) return ["Снято", "g"];
  if (diff === 0) return ["Съёмка сегодня", "a"];
  return ["Отстаём", "r"];
}

function render() {
  var ae = document.activeElement, focusD = ae && ae.getAttribute ? ae.getAttribute("data-cin") : null;
  var today = startOfToday();
  var plan = 0, done = 0, debt = 0, bonus = 0, extra = 0, started = false;
  DAYS.forEach(function (x) {
    var dn = S.done[x.d] || 0;
    plan += x.n; done += Math.min(dn, x.n);
    extra += Math.max(0, dn - x.n);
    bonus += S.bonus[x.d] || 0;
    if (x.b === "yt") bonus += Math.max(0, dn - x.n);
    if (parse(x.d) < today) { started = true; debt += Math.max(0, x.n - dn); }
  });
  var pct = Math.min(100, Math.round(done / plan * 100));
  var extraNote = extra > 0 ? '<div class="n good">+' + extra + ' сверх плана</div>' : '';
  var st, cls, note;
  if (!started) { st = "Старт 16 ноября"; cls = ""; note = "Долга пока нет"; }
  else if (debt === 0) { st = "Успеваем"; cls = "good"; note = "Все прошедшие дни закрыты"; }
  else { st = "Отстаём на " + debt; cls = "bad"; note = "Роликов не снято за прошедшие дни"; }
  document.getElementById("tiles").innerHTML =
    '<div class="tile"><div class="k">Снято по плану</div><div class="v">' + done + ' <small>из ' + plan + '</small></div><div class="bar"><b style="width:' + pct + '%"></b></div>' + extraNote + '</div>' +
    '<div class="tile"><div class="k">Статус на сегодня</div><div class="v ' + cls + '">' + st + '</div><div class="n">' + note + '</div></div>' +
    '<div class="tile"><div class="k">Запас YouTube</div><div class="v ' + (bonus >= 2 ? "good" : "") + '">' + bonus + ' <small>цель: 2 ролика</small></div><div class="bar"><b style="width:' + Math.min(100, bonus / 2 * 100) + '%;background:var(--yt)"></b></div></div>';

  var next = DAYS.filter(function (x) { return parse(x.d) >= today; })[0];
  var nx = document.getElementById("next");
  if (next) {
    var dd = diffDays(parse(next.d), today);
    var when = dd === 0 ? "Сегодня" : dd === 1 ? "Завтра" : "Через " + dd + " дн.";
    nx.innerHTML = '<div class="next"><div class="k">Ближайшая съёмка · ' + when + '</div><div class="t">' + fmt(next.d) + ' · ' + BR[next.b] + ' · ' + next.n + ' шт</div></div>';
  } else nx.innerHTML = "";

  document.getElementById("weeks").innerHTML = WEEKS.map(function (w) {
    var start = parse(w.from), end = new Date(start.getTime() + 7 * 86400000);
    var days = DAYS.filter(function (x) { var d = parse(x.d); return d >= start && d < end; });
    return '<section class="week"><div class="wh"><h2>' + w.title + '</h2><span>' + w.phase + '</span></div><div class="row">' +
      days.map(function (x) { return card(x, today); }).join("") + '</div></section>';
  }).join("");

  if (focusD) {
    var el = document.querySelector('[data-cin="' + focusD + '"]');
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
  }
}

function card(x, today) {
  var dt = parse(x.d), s = status(x, today), isToday = diffDays(dt, today) === 0;
  var done = S.done[x.d] || 0, bn = S.bonus[x.d] || 0;
  var past = diffDays(dt, today) < 0 && done >= x.n;
  var list = C.filter(function (c) { return c.d === x.d; });
  var h = '<div class="card ' + x.b + (isToday ? " today" : "") + (past ? " off" : "") + '">' +
    '<div class="top"><div class="date">' + dt.getDate() + ' ' + MONTHS[dt.getMonth()] + '<small>' + WD[dt.getDay()] + '</small></div>' +
    '<div class="plan"><b>' + x.n + '</b>' + BR[x.b] + '</div></div>' +
    '<div class="task">' + x.t + '<div class="who">' + x.who + '</div></div>' +
    '<span class="chip ' + s[1] + '">' + s[0] + '</span>';
  if (x.bonus) {
    h += '<div class="bonus"><span>' + BONUS + '</span><span class="step"><button data-a="bm" data-d="' + x.d + '" aria-label="Меньше">−</button><output>' + bn + '</output><button data-a="bp" data-d="' + x.d + '" aria-label="Больше">+</button></span></div>';
  }
  h += '<div class="ctl"><label><input type="checkbox" data-a="rd" data-d="' + x.d + '"' + (S.ready[x.d] ? " checked" : "") + '> Сценарии готовы</label>' +
    '<span class="step"><button data-a="dm" data-d="' + x.d + '" aria-label="Снято меньше">−</button><output>' + done + '</output><button data-a="dp" data-d="' + x.d + '" aria-label="Снято больше">+</button></span></div>';
  h += '<button class="cbtn" type="button" data-a="co" data-d="' + x.d + '">Комментарии' + (list.length ? ' <b>' + list.length + '</b>' : '') + '</button>';
  if (OPEN[x.d]) {
    h += '<div class="cm">' + list.map(function (c) {
      return '<div class="it">' + esc(c.text) + '<small>' + (c.by ? esc(c.by) + ", " : "") + fmtTs(c.at) + '</small><button type="button" data-a="cd" data-id="' + c.id + '" aria-label="Удалить комментарий">×</button></div>';
    }).join("") +
      '<form data-a="cf" data-d="' + x.d + '"><input type="text" data-cin="' + x.d + '" placeholder="Написать комментарий" value="' + esc(DRAFT[x.d] || "") + '" aria-label="Комментарий"><button type="submit">Добавить</button></form></div>';
  }
  return h + '</div>';
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-a]"); if (!t) return;
  var a = t.getAttribute("data-a"), d = t.getAttribute("data-d");
  if (a === "cf" || a === "rd") return;
  if (a === "co") { OPEN[d] = !OPEN[d]; render(); return; }
  if (a === "cd") { delComment(t.getAttribute("data-id")); render(); return; }
  if (a === "dp") S.done[d] = Math.min(99, (S.done[d] || 0) + 1);
  else if (a === "dm") S.done[d] = Math.max(0, (S.done[d] || 0) - 1);
  else if (a === "bp") S.bonus[d] = Math.min(9, (S.bonus[d] || 0) + 1);
  else if (a === "bm") S.bonus[d] = Math.max(0, (S.bonus[d] || 0) - 1);
  else return;
  saveDay(d); render();
});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.getAttribute && t.getAttribute("data-a") === "rd") { var d = t.getAttribute("data-d"); S.ready[d] = t.checked; saveDay(d); render(); }
});
document.addEventListener("input", function (e) {
  var d = e.target.getAttribute && e.target.getAttribute("data-cin");
  if (d) DRAFT[d] = e.target.value;
});
document.addEventListener("submit", function (e) {
  var f = e.target.closest("[data-a=cf]"); if (!f) return;
  e.preventDefault();
  var d = f.getAttribute("data-d"), v = (DRAFT[d] || "").trim();
  if (!v) return;
  DRAFT[d] = ""; addComment(d, v.slice(0, 500)); render();
});

function initBackup() {
  if (window.claude) return;   // внутри Claude данные и так общие, копия не нужна
  document.getElementById("backup").hidden = false;
  document.getElementById("exp").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify({ S: S, C: C }, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "kalendar-semok-kopiya.json";
    document.body.appendChild(a); a.click(); a.remove();
  });
  var inp = document.getElementById("impf");
  document.getElementById("imp").addEventListener("click", function () { inp.click(); });
  inp.addEventListener("change", function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (o.S) S = o.S;
        if (o.C) C = o.C;
        saveLocal(); render();
      } catch (e) {}
    };
    r.readAsText(f); inp.value = "";
  });
}

loadLocal();
initTheme();
initBackup();
render();
connect();
</script>
</body>
</html>
